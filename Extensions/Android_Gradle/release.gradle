
//AddPrePlugins
apply plugin: 'com.android.application'

//AddPostPlugins
android {
    namespace BUILD_APPID
    // r28+ emits Android's required 16 KB compatible native libraries.
    ndkVersion project.findProperty("FTW_NDK_VERSION") ?: "28.2.13676358"
    compileSdkVersion BUILD_API.toInteger()

    compileOptions {
        sourceCompatibility 1.8
        targetCompatibility 1.8
    }
    defaultConfig {
        applicationId BUILD_APPID
        minSdkVersion BUILD_MIN.toInteger()
        targetSdkVersion BUILD_TARGET.toInteger()
        versionCode BUILD_VERS_CODE.toInteger()
        versionName BUILD_VERS_NAME
        if (BUILD_API.toInteger() == 29
                && BUILD_TARGET.toInteger() == 29
                    && BUILD_WITH_LEGACY.toBoolean()==true)
        {
            manifestPlaceholders = [MaxWrite: "29", Legacy: "true", excluded: project.findProperty("BUILD_EXCLUDED") ?: "false"]
        }
        else
        {
            manifestPlaceholders = [MaxWrite: "28", Legacy: "false", excluded: project.findProperty("BUILD_EXCLUDED") ?: "false"]
        }
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared", "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
                if (project.hasProperty("FTW_ICONV_ROOT")) {
                    arguments "-DFTW_ICONV_ROOT=" + file(project.property("FTW_ICONV_ROOT")).absolutePath
                }
            }
        }
        //DefaultConfigs
    }
    if(project.hasProperty("RELEASE_STORE_FILE")) {
        signingConfigs {
            release {
                storeFile file(RELEASE_STORE_FILE)
                storePassword RELEASE_STORE_PASSWORD
                keyAlias RELEASE_KEY_ALIAS
                keyPassword RELEASE_KEY_PASSWORD
            }
        }
    }
    //SigningOptions
    buildTypes {
        if(project.hasProperty("RELEASE_STORE_FILE")) {
            release {
                signingConfig signingConfigs.release
                minifyEnabled false
                if(BUILD_OBFUSCATE.toBoolean()==true)
                    proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'
            }
        }
        debug {
            minifyEnabled false
        }
    }
    aaptOptions {
        noCompress "ccn", "mp3", "wav", "ogg", "aac", "mp4", "m4v", "mov", "avi"
    }
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
    lintOptions {
        checkReleaseBuilds false
        // Or, if you prefer, you can continue to check for errors in release builds,
        // but continue the build even when errors are found:
        abortOnError false
    }
    repositories {
    //add Repository
        flatDir {
            dirs 'libs'
        }
    }	

}

dependencies {
    //Projectsdk
    implementation "androidx.annotation:annotation:$version_X_annotation"
    implementation "androidx.exifinterface:exifinterface:$version_X_exif"
    implementation "androidx.appcompat:appcompat:$version_X_appcompat"
    implementation "androidx.core:core:$version_X_core"
    implementation "androidx.documentfile:documentfile:$version_X_documentfile"
    implementation "com.google.android.play:core:${project.findProperty('version_X_play_core') ?: '1.10.3'}"
    implementation 'org.apache.commons:commons-io:1.3.2'
    //Googlelibs
    implementation fileTree(include: ['*.jar', '*.aar'], dir: 'libs')

    implementation 'org.jetbrains:annotations:23.0.0'
}